<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balineni Developer Portal</title>
<meta name="description" content="Balineni Community Group Bank developer portal demo, created by Shiva Sankar Naidu.">
<style>
/*
VOICE: confident retail bank, calm and secure
IDEA: a bank's developer console, with a guide who talks you through each step
PICTURE: floating 3D API key card and the presenter's photo
COLOUR and TYPE: navy field, royal blue, teal support, gold accent; system sans
LAYOUT: top nav, demo strip, hero or page band, then panels
*/
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
ul,ol{list-style:none}
html{scroll-padding-top:72px}
body{font:16px/1.55 -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#dfe7f3;color:#0b1f3a;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#1652f0}
.topnav{position:sticky;top:0;z-index:20;background:#0B1F3A;color:#fff;display:flex;align-items:center;gap:1.25rem;padding:.55rem 1rem;overflow-x:auto;white-space:nowrap}
.topnav__title{font-weight:800;font-size:1rem;color:#fff;text-decoration:none;flex:none}
.topnav a.nav{color:#cfe0ff;text-decoration:none;font-size:.9rem;padding:.35rem 0;border-bottom:3px solid transparent;flex:none}
.topnav a.nav[aria-current="page"]{color:#fff;border-bottom-color:#f5b301}
.topnav a.nav:focus-visible{outline:2px solid #f5b301;outline-offset:3px}
.demo-strip{max-width:1400px;margin:.6rem auto 0;padding:0 1rem;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;font-size:.8rem;color:#3e5378}
.demo-strip button{border:1px solid #9fb3d6;background:#fff;border-radius:999px;padding:.2rem .7rem;cursor:pointer;font-size:.78rem;min-height:32px}
.page{padding:1rem;max-width:1400px;margin:0 auto}
.home-root {
    display: block;
    --navy: #0b1f3a;
    --navy-2: #12305c;
    --blue: #1652f0;
    --teal: #00b3a4;
    --gold: #f5b301;
    --ink: #0b1f3a;
    --muted: #5b6b86;
    --surface: #ffffff;
    --page: #eef3fb;
}

.home {
    background: var(--page);
    border-radius: 1rem;
    padding: 1rem;
    color: var(--ink);
}

/* ---------------- Hero ---------------- */

.hero {
    position: relative;
    overflow: hidden;
    border-radius: 1.25rem;
    padding: 2rem 2rem 1.5rem;
    background: linear-gradient(125deg, var(--navy) 0%, var(--navy-2) 45%, var(--blue) 100%);
    color: #ffffff;
    box-shadow: 0 24px 48px rgba(11, 31, 58, 0.28);
    animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.hero__orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(8px);
    opacity: 0.55;
    animation: drift 14s ease-in-out infinite alternate;
}

.hero__orb_one {
    width: 320px;
    height: 320px;
    right: -80px;
    top: -120px;
    background: radial-gradient(circle at 30% 30%, var(--teal), transparent 70%);
}

.hero__orb_two {
    width: 260px;
    height: 260px;
    left: 35%;
    bottom: -150px;
    background: radial-gradient(circle at 50% 50%, var(--gold), transparent 70%);
    animation-delay: -6s;
    opacity: 0.35;
}

.hero__grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
    -webkit-mask-image: linear-gradient(to bottom, black, transparent 85%);
}

.hero__inner {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 2rem;
    align-items: center;
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.75rem 0.35rem 0.35rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.18);
    font-size: 0.8rem;
}

.brand__mark {
    display: inline-grid;
    place-items: center;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), #ffd666);
    color: var(--navy);
    font-weight: 800;
}

.brand__name {
    font-weight: 700;
}

.brand__divider {
    width: 1px;
    height: 0.9rem;
    background: rgba(255, 255, 255, 0.35);
}

.brand__product {
    opacity: 0.85;
}

.hero__title {
    margin-top: 1rem;
    font-size: 2rem;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.02em;
}

.hero__subtitle {
    margin-top: 0.6rem;
    max-width: 36rem;
    font-size: 0.95rem;
    line-height: 1.55;
    color: #d6e4ff;
}

.hero__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 1.25rem;
}

.btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.65rem 1.2rem;
    border-radius: 0.75rem;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.btn:hover {
    transform: translateY(-2px);
}

.btn:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
}

.btn_gold {
    background: linear-gradient(135deg, var(--gold), #ffd666);
    color: var(--navy);
    box-shadow: 0 10px 22px rgba(245, 179, 1, 0.35);
}

.btn_gold .btn__icon {
    --slds-c-icon-color-foreground-default: #0b1f3a;
}

.btn_ghost {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.35);
    color: #ffffff;
}

.trust {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 1.25rem;
    font-size: 0.78rem;
    color: #cfe0ff;
}

.trust li {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
}

/* Floating 3D credential card */
.hero__visual {
    position: relative;
    height: 220px;
    perspective: 1000px;
}

.credential-card {
    position: absolute;
    top: 10px;
    left: 50%;
    width: 300px;
    height: 185px;
    margin-left: -150px;
    padding: 1.1rem 1.2rem;
    border-radius: 1rem;
    background: linear-gradient(135deg, #1d3d73 0%, #1652f0 55%, #00b3a4 100%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
    transform-style: preserve-3d;
    transform: rotateX(18deg) rotateY(-22deg) rotateZ(4deg);
    animation: float 6s ease-in-out infinite;
    overflow: hidden;
    z-index: 2;
}

.credential-card_back {
    top: 34px;
    margin-left: -120px;
    background: linear-gradient(135deg, rgba(245, 179, 1, 0.9), rgba(255, 214, 102, 0.6));
    opacity: 0.55;
    z-index: 1;
    animation-delay: -3s;
}

.credential-card__shine {
    position: absolute;
    inset: -50%;
    background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.35) 50%, transparent 60%);
    animation: shine 5s ease-in-out infinite;
}

.credential-card__top,
.credential-card__bottom {
    position: relative;
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
}

.credential-card__bank {
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
}

.credential-card__tag {
    padding: 0.1rem 0.45rem;
    border-radius: 0.3rem;
    background: rgba(255, 255, 255, 0.2);
}

.credential-card__chip {
    position: relative;
    width: 42px;
    height: 32px;
    margin: 1.1rem 0 0.7rem;
    border-radius: 0.4rem;
    background: linear-gradient(135deg, #ffe08a, #c99700);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
}

.credential-card__number {
    position: relative;
    font-family: 'Courier New', monospace;
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    margin-bottom: 0.9rem;
}

.credential-card__bottom {
    opacity: 0.85;
}

.hero__anchor {
    position: relative;
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
}

.credit {
    position: absolute;
    right: 0;
    bottom: 0;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffe08a;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
}

.footer {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.25rem;
    padding: 0.8rem 1rem;
    border-radius: 0.8rem;
    background: var(--navy);
    color: #cfe0ff;
    font-size: 0.75rem;
}

/* ---------------- Stats ---------------- */

.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1rem;
    margin-top: 1.25rem;
}

.tilt {
    --rx: 0deg;
    --ry: 0deg;
    --glare-x: 50%;
    --glare-y: 50%;
    position: relative;
    overflow: hidden;
    transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));
    transition: transform 0.15s ease-out, box-shadow 0.3s ease;
    will-change: transform;
}

.tilt:hover {
    box-shadow: 0 22px 40px rgba(11, 31, 58, 0.22);
}

.tilt__glare {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at var(--glare-x) var(--glare-y), rgba(255, 255, 255, 0.35), transparent 55%);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.tilt:hover .tilt__glare {
    opacity: 1;
}

.stat {
    padding: 1.1rem 1.2rem;
    border-radius: 1rem;
    background: var(--surface);
    box-shadow: 0 10px 24px rgba(11, 31, 58, 0.1);
    animation: rise 0.7s var(--delay, 0ms) cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.stat__icon {
    display: inline-grid;
    place-items: center;
    width: 2.4rem;
    height: 2.4rem;
    border-radius: 0.75rem;
    box-shadow: 0 8px 16px rgba(11, 31, 58, 0.18);
}

.stat[data-tone='blue'] .stat__icon {
    background: linear-gradient(135deg, #3b73ff, var(--blue));
}

.stat[data-tone='gold'] .stat__icon {
    background: linear-gradient(135deg, #ffcf3d, #d99a00);
}

.stat[data-tone='teal'] .stat__icon {
    background: linear-gradient(135deg, #22d3c5, #00897e);
}

.stat[data-tone='navy'] .stat__icon {
    background: linear-gradient(135deg, #2a4a7f, var(--navy));
}

.stat__value {
    margin-top: 0.75rem;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
}

.stat__label {
    margin-top: 0.35rem;
    color: var(--muted);
    font-size: 0.8rem;
}

/* ---------------- Panels ---------------- */

.columns {
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 1rem;
    margin-top: 1.25rem;
}

.panel {
    padding: 1.2rem;
    border-radius: 1rem;
    background: var(--surface);
    box-shadow: 0 10px 24px rgba(11, 31, 58, 0.08);
    animation: rise 0.8s 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.panel__header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.9rem;
}

.panel__header_spaced {
    margin-top: 1.4rem;
}

.panel__title {
    font-size: 1rem;
    font-weight: 800;
}

.panel__hint {
    font-size: 0.75rem;
    color: var(--muted);
}

.empty {
    color: var(--muted);
    font-size: 0.85rem;
}

/* API flip cards */
.api-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 0.9rem;
}

.flip {
    height: 170px;
    perspective: 1000px;
    border-radius: 1rem;
    outline: none;
    animation: rise 0.7s var(--delay, 0ms) cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.flip__inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.flip:hover .flip__inner,
.flip:focus .flip__inner,
.flip:focus-within .flip__inner {
    transform: rotateY(180deg);
}

.flip:focus-visible {
    box-shadow: 0 0 0 3px var(--gold);
}

.flip__face {
    position: absolute;
    inset: 0;
    padding: 1rem;
    border-radius: 1rem;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.flip__front {
    background: linear-gradient(160deg, #ffffff 0%, #f1f6ff 100%);
    border: 1px solid #dbe5f7;
    box-shadow: 0 10px 20px rgba(11, 31, 58, 0.08);
}

.flip__back {
    background: linear-gradient(135deg, var(--navy), var(--blue));
    color: #ffffff;
    transform: rotateY(180deg);
    overflow: auto;
}

.api-card__icon {
    display: inline-grid;
    place-items: center;
    width: 2.2rem;
    height: 2.2rem;
    border-radius: 0.7rem;
    background: linear-gradient(135deg, var(--blue), var(--teal));
    box-shadow: 0 8px 16px rgba(22, 82, 240, 0.3);
}

.api-card__name {
    margin-top: 0.6rem;
    font-weight: 800;
}

.api-card__meta {
    font-size: 0.75rem;
    color: var(--muted);
}

.api-card__desc {
    margin-top: 0.4rem;
    font-size: 0.8rem;
    line-height: 1.45;
    color: #d6e4ff;
}

.consent-pill {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    background: #fff4d6;
    color: #8a5a00;
    font-size: 0.7rem;
    font-weight: 700;
}

/* Recent apps */
.app-list li + li {
    margin-top: 0.5rem;
}

.app-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    width: 100%;
    padding: 0.6rem 0.7rem;
    border-radius: 0.8rem;
    border: 1px solid #e3eaf6;
    background: #fbfdff;
    text-align: left;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.app-row:hover,
.app-row:focus-visible {
    transform: translateX(4px);
    border-color: var(--blue);
    box-shadow: 0 8px 16px rgba(22, 82, 240, 0.12);
    outline: none;
}

.app-row__avatar {
    display: inline-grid;
    place-items: center;
    flex: none;
    width: 2rem;
    height: 2rem;
    border-radius: 0.6rem;
    background: linear-gradient(135deg, var(--navy), var(--blue));
}

.app-row__text {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
}

.app-row__name {
    font-weight: 700;
    color: var(--ink);
}

.app-row__sub {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.env-pill {
    flex: none;
    padding: 0.1rem 0.55rem;
    border-radius: 999px;
    background: #e6f0ff;
    color: var(--blue);
    font-size: 0.7rem;
    font-weight: 700;
}

.env-pill_live {
    background: #dff7f4;
    color: #00796f;
}

/* Timeline */
.timeline {
    position: relative;
    padding-left: 0.2rem;
}

.timeline__item {
    position: relative;
    display: flex;
    gap: 0.7rem;
    padding-bottom: 0.8rem;
}

.timeline__item:not(:last-child)::before {
    content: '';
    position: absolute;
    left: 0.75rem;
    top: 1.6rem;
    bottom: 0;
    width: 2px;
    background: #dbe5f7;
}

.timeline__dot {
    display: inline-grid;
    place-items: center;
    flex: none;
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 0 4px #e6f0ff;
}

.timeline__item_access_approved .timeline__dot {
    background: #2e844a;
    box-shadow: 0 0 0 4px #e3f5e9;
}

.timeline__item_access_rejected .timeline__dot,
.timeline__item_error .timeline__dot {
    background: #ba0517;
    box-shadow: 0 0 0 4px #fde8e8;
}

.timeline__item_case_raised .timeline__dot {
    background: #d99a00;
    box-shadow: 0 0 0 4px #fff4d6;
}

.timeline__label {
    font-size: 0.82rem;
    font-weight: 600;
}

.timeline__time {
    font-size: 0.72rem;
    color: var(--muted);
}

.error-banner {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    background: #fde8e8;
    color: #8e030f;
}

/* ---------------- Animations ---------------- */

@keyframes rise {
    from {
        opacity: 0;
        transform: perspective(900px) translateY(24px) rotateX(10deg);
    }
    to {
        opacity: 1;
        transform: perspective(900px) translateY(0) rotateX(0);
    }
}

@keyframes float {
    0%,
    100% {
        transform: rotateX(18deg) rotateY(-22deg) rotateZ(4deg) translateY(0);
    }
    50% {
        transform: rotateX(12deg) rotateY(-12deg) rotateZ(2deg) translateY(-12px);
    }
}

@keyframes drift {
    from {
        transform: translate(0, 0) scale(1);
    }
    to {
        transform: translate(-40px, 30px) scale(1.1);
    }
}

@keyframes shine {
    0%,
    60% {
        transform: translateX(-60%);
    }
    100% {
        transform: translateX(60%);
    }
}

/* ---------------- Responsive and motion ---------------- */

@media (max-width: 1024px) {
    .hero__inner,
    .columns {
        grid-template-columns: minmax(0, 1fr);
    }
    .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .hero__visual {
        display: none;
    }
    .credit {
        position: static;
        display: inline-block;
        margin-top: 0.75rem;
    }
}

@media (prefers-reduced-motion: reduce) {
    .hero,
    .hero__orb,
    .credential-card,
    .credential-card__shine,
    .stat,
    .panel,
    .flip {
        animation: none;
    }
    .tilt,
    .flip__inner,
    .btn,
    .app-row {
        transition: none;
    }
}

.anchor-root {
    display: block;
}

.anchor {
    display: flex;
    align-items: center;
    gap: 1rem;
    perspective: 900px;
    animation: anchor-in 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.anchor__photo-button {
    position: relative;
    flex: none;
    border: none;
    padding: 0;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
}

.anchor__photo-button:hover,
.anchor__photo-button:focus-visible {
    transform: rotateY(-14deg) rotateX(6deg) translateZ(10px);
}

.anchor__photo-button:focus-visible {
    outline: 3px solid #f5b301;
    outline-offset: 4px;
}

.anchor__photo {
    position: relative;
    display: block;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ffffff;
    box-shadow: 0 12px 28px rgba(11, 31, 58, 0.35);
}

.anchor__ring {
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #f5b301, #00b3a4, #1652f0, #f5b301);
    animation: ring-spin 6s linear infinite;
}

.anchor__live {
    position: absolute;
    right: 4px;
    bottom: 6px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #2ecc71;
    border: 2px solid #ffffff;
    animation: pulse 2s ease-in-out infinite;
}

.anchor__body {
    min-width: 0;
}

.anchor__name {
    font-weight: 700;
    line-height: 1.2;
}

.anchor__role {
    font-size: 0.75rem;
    opacity: 0.8;
    margin-bottom: 0.4rem;
}

.anchor__bubble {
    position: relative;
    display: inline-block;
    max-width: 34rem;
    padding: 0.6rem 0.9rem;
    border-radius: 0.9rem;
    border-top-left-radius: 0.2rem;
    line-height: 1.45;
    min-height: 2.3rem;
    box-shadow: 0 10px 24px rgba(11, 31, 58, 0.18);
    animation: bubble-in 0.6s 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.anchor__caret {
    display: inline-block;
    width: 2px;
    height: 1em;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: currentColor;
    animation: blink 0.8s steps(1) infinite;
}

/* Hero: large, for dark banners */
.anchor_hero .anchor__photo {
    width: 112px;
    height: 112px;
}

.anchor_hero .anchor__name {
    color: #ffffff;
    font-size: 1.05rem;
}

.anchor_hero .anchor__role {
    color: #cfe0ff;
}

.anchor_hero .anchor__bubble {
    background: rgba(255, 255, 255, 0.96);
    color: #0b1f3a;
    font-size: 0.95rem;
}

/* Compact: small, for light cards */
.anchor_compact .anchor__photo {
    width: 64px;
    height: 64px;
}

.anchor_compact .anchor__name {
    color: #0b1f3a;
}

.anchor_compact .anchor__role {
    color: #3e5378;
}

.anchor_compact .anchor__bubble {
    background: linear-gradient(135deg, #0b1f3a, #1652f0);
    color: #ffffff;
    font-size: 0.85rem;
}

@keyframes anchor-in {
    from {
        opacity: 0;
        transform: translateY(18px) rotateX(18deg);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

@keyframes bubble-in {
    from {
        opacity: 0;
        transform: translateX(-12px) scale(0.92);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

@keyframes ring-spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes pulse {
    0%,
    100% {
        box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6);
    }
    50% {
        box-shadow: 0 0 0 7px rgba(46, 204, 113, 0);
    }
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

@media (prefers-reduced-motion: reduce) {
    .anchor,
    .anchor__bubble,
    .anchor__ring,
    .anchor__live,
    .anchor__caret {
        animation: none;
    }
    .anchor__photo-button {
        transition: none;
    }
}

/* ---------- demo pages ---------- */
.no-anim .hero,.no-anim .stat,.no-anim .panel,.no-anim .flip,.no-anim .page-head,.no-anim .anchor,.no-anim .anchor__bubble{animation:none!important}
.page-head{position:relative;overflow:hidden;padding:1.4rem 1.5rem;border-radius:1.25rem;background:linear-gradient(125deg,#0b1f3a 0%,#12305c 50%,#1652f0 100%);color:#fff;box-shadow:0 16px 32px rgba(11,31,58,.25);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.page-head::after{content:'';position:absolute;right:-60px;top:-90px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#00b3a4,transparent 70%);opacity:.45}
.page-head__brand{position:relative;display:inline-flex;align-items:center;gap:.5rem;font-size:.8rem;color:#cfe0ff}
.page-head__brand .brand__mark{width:1.5rem;height:1.5rem}
.page-head__title{position:relative;margin-top:.4rem;font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;line-height:1.15;text-wrap:balance}
.page-head__sub{position:relative;margin-top:.3rem;color:#d6e4ff;max-width:46rem}
.page-head__credit{position:absolute;right:1.25rem;bottom:1rem;z-index:1;color:#ffe08a;font-size:.72rem;font-weight:600}
.anchor-panel{margin-top:1rem}
.section{margin-top:1rem}
.btn_primary{background:linear-gradient(135deg,#12305c,#1652f0);color:#fff;box-shadow:0 8px 18px rgba(22,82,240,.25)}
.btn_light{background:#fff;border-color:#c8d5ea;color:#0b1f3a}
.btn_success{background:#2e844a;color:#fff}
.btn_danger{background:#ba0517;color:#fff}
.btn_small{padding:.4rem .8rem;font-size:.8rem;min-height:36px;border-radius:.6rem}
.btn{min-height:44px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn_light:focus-visible,.btn_primary:focus-visible,.btn_success:focus-visible,.btn_danger:focus-visible{outline:3px solid #f5b301;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.row_end{justify-content:flex-end}
.row_between{justify-content:space-between}
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin-bottom:1.25rem}
.path li{padding:.6rem .8rem;border-radius:.7rem;background:#eef3fb;color:#5b6b86;font-size:.85rem;font-weight:600;display:flex;gap:.5rem;align-items:center}
.path li span{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;color:#5b6b86;font-size:.75rem;flex:none}
.path li.done{background:#dff7f4;color:#00796f}.path li.done span{background:#00b3a4;color:#fff}
.path li.on{background:linear-gradient(135deg,#0b1f3a,#1652f0);color:#fff;box-shadow:0 8px 18px rgba(22,82,240,.25)}.path li.on span{background:#f5b301;color:#0b1f3a}
.step{animation:step-in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes step-in{from{opacity:0;transform:perspective(900px) translateX(30px) rotateY(-14deg)}to{opacity:1;transform:none}}
.field{margin-bottom:1rem}
.field>label,.field>.label{display:block;font-weight:700;font-size:.88rem;margin-bottom:.3rem}
.field .hint{font-size:.78rem;color:#5b6b86;margin-top:.25rem}
.field .count{float:right;font-weight:400;color:#5b6b86;font-size:.78rem}
input[type=text],input[type=url],input[type=date],select,textarea{width:100%;min-height:44px;padding:.55rem .75rem;border:1px solid #c8d5ea;border-radius:.6rem;background:#fff;font-size:16px}
textarea{min-height:96px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(22,82,240,.35);border-color:#1652f0}
[aria-invalid=true]{border-color:#ba0517!important}
.err{color:#ba0517;font-size:.8rem;margin-top:.3rem}
.alert{padding:.7rem 1rem;border-radius:.7rem;background:#fde8e8;color:#8e030f;margin-bottom:1rem;font-weight:600}
.info{padding:.8rem 1rem;border-radius:.8rem;background:#eef3fb;color:#12305c;font-size:.9rem}
.seg{display:inline-flex;flex-wrap:wrap;gap:.3rem;padding:.3rem;border-radius:.8rem;background:#eef3fb}
.seg button{border:0;background:transparent;padding:.5rem .9rem;border-radius:.6rem;font-weight:600;font-size:.88rem;cursor:pointer;min-height:40px;color:#3e5378}
.seg button[aria-pressed=true]{background:#fff;color:#0b1f3a;box-shadow:0 4px 12px rgba(11,31,58,.12)}
.seg button:focus-visible{outline:2px solid #1652f0}
.checks{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem}
.checks label{display:inline-flex;gap:.45rem;align-items:center;font-size:.9rem;min-height:36px;cursor:pointer}
.checks input{width:18px;height:18px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.75rem;color:#5b6b86;font-weight:700;padding:.5rem .6rem;border-bottom:2px solid #e3eaf6;white-space:nowrap}
.tbl td{padding:.6rem;border-bottom:1px solid #eef3fb;vertical-align:top}
.tbl td.nowrap{white-space:nowrap}
.tbl input,.tbl select{min-height:40px}
.pill{display:inline-block;padding:.12rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill_Pending{background:#fff4d6;color:#8a5a00}.pill_Approved,.pill_Active{background:#e3f5e9;color:#1f6b38}.pill_Rejected{background:#fde8e8;color:#8e030f}.pill_Cancelled,.pill_Closed{background:#eef1f5;color:#5b6b86}.pill_New{background:#e6f0ff;color:#1652f0}
.linkbtn{border:0;background:none;color:#1652f0;font-weight:700;cursor:pointer;text-align:left;padding:0;text-decoration:underline;text-underline-offset:2px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7rem;margin-bottom:1rem}
.pick{display:block;padding:.8rem;border-radius:.9rem;border:1px solid #dbe5f7;background:#fff;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
.pick:hover{transform:perspective(700px) rotateX(4deg) translateY(-3px);box-shadow:0 12px 22px rgba(11,31,58,.12)}
.pick.sel{border-color:#1652f0;box-shadow:0 0 0 2px #1652f0 inset}
.pick input{width:18px;height:18px;margin-right:.4rem;vertical-align:-3px}
.pick b{font-size:.95rem}
.pick p{font-size:.8rem;color:#5b6b86;margin-top:.25rem}
.formbox{padding:1rem;border-radius:1rem;background:#f8fafc;border:1px solid #e3eaf6;margin-bottom:1rem;animation:step-in .5s cubic-bezier(.2,.8,.2,1) both}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem 1.25rem}
.kv dt{font-size:.75rem;color:#5b6b86;font-weight:700}
.kv dd{font-weight:600;overflow-wrap:anywhere}
.mono{font-family:Consolas,'Courier New',monospace}
.secret{padding:.9rem;border-radius:.9rem;background:#fff8f0;border:1px solid #fe9339;margin-top:1rem}
.secret code{display:block;padding:.6rem;margin:.5rem 0;border-radius:.5rem;background:#fff;border:1px dashed #fe9339;overflow-wrap:anywhere;font-size:.9rem}
.success-head{display:flex;gap:.7rem;align-items:center;margin-bottom:1rem}
.success-head .tick{display:inline-grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:#2e844a;box-shadow:0 0 0 6px #e3f5e9;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:1.25rem;z-index:50;transform:translate(-50%,150%);background:#0b1f3a;color:#fff;padding:.75rem 1.1rem;border-radius:.8rem;box-shadow:0 16px 32px rgba(11,31,58,.35);font-size:.9rem;max-width:calc(100vw - 2rem);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:translate(-50%,0)}
.toast b{color:#ffe08a}
.files{font-size:.8rem;color:#3e5378;margin-top:.4rem}
.muted{color:#5b6b86;font-size:.85rem}
@media (max-width:700px){
 .path{grid-template-columns:minmax(0,1fr)}
 .page-head__credit{position:static;display:block;margin-top:.5rem}
 .stack thead{display:none}
 .stack tr{display:grid;padding:.5rem 0;border-bottom:1px solid #e3eaf6}
 .stack td{display:flow-root;border:0;padding:.25rem 0 .25rem 8.5em;white-space:normal}
 .stack td::before{content:attr(data-l);float:left;width:8em;margin-left:-8.5em;font-size:.75rem;color:#5b6b86;font-weight:700}
 .stack td:empty{display:none}
 .hero{padding:1.25rem}
 .hero__title{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){.step,.formbox,.page-head,.success-head .tick,.pick{animation:none;transition:none}.toast{transition:none}}
</style>
</head>

function say(msg, force) {

  c.style.display = 'inline-block';
  let i = 0; t.textContent = '';

function validateStep() {
  const w = wiz; w.errors = {}; w.error = '';
  if (w.step === 1 && !w.devId) w.errors.devId = 'Select a developer.';
  if (w.step === 2) {
    if (w.mode === 'NEW') {
      const name = w.name.trim(), d = dev(w.devId);
      if (!/^[A-Za-z0-9][A-Za-z0-9 _-]{2,39}$/.test(name)) w.errors.name = 'Use 3–40 letters, numbers, spaces, hyphens or underscores, starting with a letter or number.';
      else if (S.apps.some(a => sameOwner(a, d) && a.name.toLowerCase() === name.toLowerCase())) w.errors.name = 'Your organisation already has an app with this name.';
    } else if (!existingOptions().length) w.error = 'There is no app to connect to. Create a new app instead.';
    else if (!w.existingId) w.errors.existingId = 'Select an existing app.';
  }
  if (w.step === 3) {
    if (!w.grants.length) w.errors.grants = 'Select at least one grant type.';
    if (w.auth === 'Private_Key_JWT') {
      if (w.keySource === 'Self_Hosted_URL') {
        if (!/^https:\/\/\S+\.\S+/i.test(w.jwksUrl.trim())) w.errors.jwksUrl = 'Enter a JWKS URL that starts with https://';
      } else if (!w.keys.length) w.errors.keys = 'Add at least one key.';
      else {
        const seen = {}; const today = new Date().toISOString().slice(0, 10);
        w.keys.forEach((k, i) => {
          const kid = k.kid.trim().toLowerCase();
          if (!kid) w.errors['kid' + i] = 'Enter a key ID.';
          else if (seen[kid]) w.errors['kid' + i] = 'Each key ID must be unique.';
          seen[kid] = true;
          if (k.expiry && k.expiry <= today) w.errors['exp' + i] = 'Choose a date in the future.';
        });
      }
    }
  }
  return !w.error && !Object.keys(w.errors).length;
}
function submitWizard() {
  const w = wiz, d = dev(w.devId);
  if (w.mode === 'EXISTING') {
    const a = appById(w.existingId);
    log(a.id, 'Existing_App_Selected', 'Developer chose to reuse the existing app credentials.');
    w.result = {appId:a.id, name:a.name, clientId:a.clientId, isNew:false};
  } else {
    const id = 'A' + (++S.seq.app);
    const a = {id, name:w.name.trim(), desc:w.desc.trim(), env:w.env, status:'Active', devId:d.id, partner:d.partner, auth:w.auth,
      grants:[...w.grants], clientId:'app_' + hex(16), created:Date.now()};
    let secret = null;
    if (w.auth === 'Client_Secret') { secret = hex(32); a.secretHint = secret.slice(-4); a.secretRotated = Date.now(); }
    else { a.keySource = w.keySource; a.idAlg = w.idAlg; a.authAlg = w.authAlg; if (w.keySource === 'Self_Hosted_URL') a.jwksUrl = w.jwksUrl.trim(); }
    S.apps.push(a);
    log(id, 'App_Created', `App created in ${a.env} using ${AUTH_LABEL[a.auth]}.`);
    if (w.auth === 'Private_Key_JWT' && w.keySource === 'Generated_Keys') {
      w.keys.forEach(k => S.keys.push({id:'K' + (++S.seq.key), appId:id, kid:k.kid.trim(), type:k.type, expiry:k.expiry || '', comments:k.comments.trim()}));
      log(id, 'Keys_Added', `${w.keys.length} key(s) registered.`);
    }
    if (secret) log(id, 'Secret_Generated', 'Client secret generated.');
    w.result = {appId:id, name:a.name, clientId:a.clientId, secret, isNew:true};
  }
  save();
  toast(w.result.isNew ? 'App created.' : 'App connected.', `${w.result.name} is ready in ${w.env}.`);
}

    <dl class="kv"><div><dt>Developer</dt><dd>${esc(d ? d.name : '')}</dd></div><div><dt>Environment</dt><dd>${esc(a.env)}</dd></div>
    <div><dt>Authentication</dt><dd>${AUTH_LABEL[a.auth]}</dd></div><div><dt>Client ID</dt><dd class="mono">${esc(a.clientId)} <button class="linkbtn" type="button" data-act="copy" data-text="${esc(a.clientId)}">Copy</button></dd></div>
    ${a.auth === 'Client_Secret' ? `<div><dt>Client secret</dt><dd class="mono">•••• ${esc(a.secretHint || '')}</dd></div>` : `<div><dt>Key source</dt><dd>${a.keySource === 'Self_Hosted_URL' ? 'Self-hosted JWKS URL' : 'Keys added here'}</dd></div>
    <div><dt>Signing algorithms</dt><dd>${esc(a.idAlg)} / ${esc(a.authAlg)}</dd></div>${a.jwksUrl ? `<div><dt>JWKS URL</dt><dd>${esc(a.jwksUrl)}</dd></div>` : ''}`}
    <div><dt>Grant types</dt><dd>${esc(a.grants.join(', '))}</dd></div><div><dt>Created</dt><dd>${fmtDate(a.created)}</dd></div></dl>
    ${a.desc ? `<p class="muted" style="margin-top:.8rem">${esc(a.desc)}</p>` : ''}
    ${keys.length ? `<h3 class="panel__title" style="margin:1.2rem 0 .5rem">Keys (${keys.length})</h3><div class="tbl-wrap"><table class="tbl stack"><thead><tr><th>Key ID</th><th>Type</th><th>Expiry</th><th>Comments</th></tr></thead><tbody>
      ${keys.map(k => `<tr><td data-l="Key ID" class="mono">${esc(k.kid)}</td><td data-l="Type">${esc(k.type)}</td><td data-l="Expiry">${esc(k.expiry || 'No expiry')}</td><td data-l="Comments">${esc(k.comments)}</td></tr>`).join('')}</tbody></table></div>` : ''}
  </section>
  <section class="panel section" id="access"><div class="panel__header"><h2 class="panel__title">API access (${reqs.length})</h2>
    <button class="btn btn_primary btn_small" type="button" data-act="reqopen" data-id="${id}"${reqOpen || !available.length || a.status !== 'Active' ? ' disabled' : ''}>${ico('plus', 14)} Request API access</button></div>
    ${!available.length && !reqOpen ? '<p class="muted" style="margin-bottom:.6rem">This app already has, or has asked for, every available API.</p>' : ''}${access}</section>
  <section class="panel section" id="support"><div class="panel__header"><h2 class="panel__title">Support cases (${cases.length})</h2>
    <button class="btn btn_primary btn_small" type="button" data-act="caseopen" data-id="${id}"${casOpen ? ' disabled' : ''}>${ico('plus', 14)} Raise an issue</button></div>${support}</section>
  <section class="panel section"><div class="panel__header"><h2 class="panel__title">Event log</h2></div>${timeline(logs)}</section>${footer()}`;
}
function appMsg(id) {
  if (cas.appId === id && cas.step === 'files') { const c = S.cases.find(x => x.id === cas.caseId); return `Case ${c ? c.num : ''} is with our support team. Attach screenshots or logs if they help us fix it faster.`; }
  if (cas.appId === id && cas.step === 'details') return 'Tell us what happened and when it started. On the next step you can attach screenshots or log files.';
  if (req.appId === id) return "Pick the APIs your app needs and tell the API owner why. APIs marked 'Needs customer consent' read customer data, so explain how you'll use it.";
  const a = appById(id);
  if (!a) return 'That app is not here any more. Let me take you back to the list.';
  const pending = S.requests.filter(r => r.appId === id && r.status === 'Pending').length;
  return pending ? `${a.name} has ${pending} request${pending > 1 ? 's' : ''} waiting for the API owner. Switch to Review Requests to approve as the employee.` : `This is ${a.name}. Request API access, raise a support case, and follow every step in the event log.`;
}

/* ---------------- review queue ---------------- */
function renderReview() {
  const rows = S.requests.filter(r => r.status === 'Pending').sort((x, y) => x.created - y.created);
  const sel = rev.reqId && S.requests.find(r => r.id === rev.reqId && r.status === 'Pending');
  let panel = '';
  if (sel) {
    const a = appById(sel.appId), p = api(sel.apiId), rej = rev.decision === 'Rejected';
    panel = `<div class="formbox" style="border-left:4px solid ${rej ? '#ba0517' : '#2e844a'};background:${rej ? '#fef5f5' : '#f3fbf6'}">
      <h3 class="panel__title" style="margin-bottom:.6rem">${rej ? 'Reject' : 'Approve'} ${esc(sel.num)}</h3>
      <dl class="kv" style="margin-bottom:.8rem"><div><dt>App</dt><dd>${esc(a.name)} (${esc(a.env)})</dd></div><div><dt>Partner</dt><dd>${esc(a.partner || 'Independent developer')}</dd></div>
      <div><dt>API</dt><dd>${esc(p.name)}</dd></div><div><dt>Reason</dt><dd>${esc(sel.reason)}</dd></div></dl>
      <div class="field"><label for="f-rc">${rej ? 'Why are you rejecting this request?' : 'Comments for the developer (optional)'}</label>
      <textarea id="f-rc" maxlength="1000" data-bind="rev.comments"${inv(rev, 'comments')}>${esc(rev.comments)}</textarea>${err(rev, 'comments')}</div>
      <div class="row row_end"><button class="btn btn_light" type="button" data-act="revcancel">Cancel</button>
      <button class="btn ${rej ? 'btn_danger' : 'btn_success'}" type="button" data-act="revconfirm">${rej ? 'Reject request' : 'Approve request'}</button></div></div>`;
  }
  const table = rows.length ? `<div class="tbl-wrap"><table class="tbl stack"><thead><tr><th>Requested on</th><th>Request</th><th>App</th><th>Env</th><th>Partner</th><th>Developer</th><th>API</th><th>Consent</th><th>Reason</th><th>Decision</th></tr></thead><tbody>
    ${rows.map(r => { const a = appById(r.appId), p = api(r.apiId), d = dev(r.devId); return `<tr><td data-l="Requested" class="nowrap">${fmt(r.created)}</td><td data-l="Request" class="nowrap">${esc(r.num)}</td>
      <td data-l="App"><button class="linkbtn" type="button" data-go="app-${a.id}">${esc(a.name)}</button></td><td data-l="Env">${esc(a.env)}</td><td data-l="Partner">${esc(a.partner || 'Independent')}</td>
      <td data-l="Developer">${esc(d ? d.name : '')}</td><td data-l="API">${esc(p.name)}</td><td data-l="Consent">${p.consent ? 'Required' : 'No'}</td><td data-l="Reason">${esc(r.reason)}</td>
      <td data-l="Decision"><div class="row"><button class="btn btn_success btn_small" type="button" data-act="review" data-id="${r.id}" data-d="Approved">${ico('check', 14)} Approve</button>
      <button class="btn btn_danger btn_small" type="button" data-act="review" data-id="${r.id}" data-d="Rejected">${ico('close', 14)} Reject</button></div></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="info" style="text-align:center;padding:1.5rem">${ico('check', 18, '#2e844a')} Nothing to review. New requests will show up here.</div>`;
  return pageHead('API access requests to review', 'Employee view: the API owner approves or rejects each request.') +
    `<section class="panel section"><div class="panel__header"><h2 class="panel__title">Pending (${rows.length})</h2><span class="panel__hint">Oldest first</span></div>${panel}${table}</section>${footer()}`;
}
function reviewMsg() {
  const n = S.requests.filter(r => r.status === 'Pending').length;
  if (rev.reqId) return rev.decision === 'Rejected' ? 'Rejections need a comment so the developer knows what to fix.' : 'Approving lets the app call this API straight away. Add a note for the developer if it helps.';
  return n ? `${n} request${n > 1 ? 's are' : ' is'} waiting. Check the reason and the consent flag, then approve or reject.` : "All caught up! New requests appear here, and the API owner gets a bell notification in Salesforce.";
}

/* ---------------- lists ---------------- */
function renderApps() {
  const apps = [...S.apps].sort((a, b) => b.created - a.created);
  return pageHead('Developer apps', 'Every app registered in the portal.') + `<section class="panel section"><div class="panel__header"><h2 class="panel__title">All apps (${apps.length})</h2>
    <button class="btn btn_primary btn_small" type="button" data-go="create">${ico('plus', 14)} Create an app</button></div>
    ${apps.length ? `<div class="tbl-wrap"><table class="tbl stack"><thead><tr><th>App</th><th>Partner</th><th>Developer</th><th>Environment</th><th>Authentication</th><th>Approved APIs</th><th>Created</th></tr></thead><tbody>
    ${apps.map(a => `<tr><td data-l="App"><button class="linkbtn" type="button" data-go="app-${a.id}">${esc(a.name)}</button></td><td data-l="Partner">${esc(a.partner || 'Independent')}</td>
      <td data-l="Developer">${esc((dev(a.devId) || {}).name)}</td><td data-l="Environment"><span class="env-pill${a.env === 'Live' ? ' env-pill_live' : ''}">${esc(a.env)}</span></td>
      <td data-l="Auth">${AUTH_LABEL[a.auth]}</td><td data-l="Approved APIs">${S.requests.filter(r => r.appId === a.id && r.status === 'Approved').length}</td><td data-l="Created" class="nowrap">${fmtDate(a.created)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">No apps yet.</p>'}</section>${footer()}`;
}
function renderCases() {
  const cases = [...S.cases].sort((a, b) => b.created - a.created);
  return pageHead('Support cases', 'Employee view: every case raised from a developer app.') + `<section class="panel section"><div class="panel__header"><h2 class="panel__title">All cases (${cases.length})</h2></div>
    ${cases.length ? `<div class="tbl-wrap"><table class="tbl stack"><thead><tr><th>Case</th><th>Subject</th><th>App</th><th>Category</th><th>Status</th><th>Opened</th><th>Files</th><th></th></tr></thead><tbody>
    ${cases.map(c => { const a = appById(c.appId); return `<tr><td data-l="Case" class="nowrap">${esc(c.num)}</td><td data-l="Subject">${esc(c.subject)}</td>
      <td data-l="App">${a ? `<button class="linkbtn" type="button" data-go="app-${a.id}">${esc(a.name)}</button>` : ''}</td><td data-l="Category">${CATEGORY[c.category]}</td><td data-l="Status">${pill(c.status)}</td>
      <td data-l="Opened" class="nowrap">${fmtDate(c.created)}</td><td data-l="Files">${c.files.length ? esc(c.files.join(', ')) : '0'}</td>
      <td data-l="Action">${c.status !== 'Closed' ? `<button class="btn btn_light btn_small" type="button" data-act="closecase" data-id="${c.id}">Close case</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<p class="muted">No support cases yet. Open an app and use Raise an issue.</p>'}</section>${footer()}`;
}

/* ---------------- router ---------------- */
function page() { return (location.hash.slice(1) || 'home'); }
function render() {
  const p = page();
  let html, msg;
  if (p === 'create') { html = renderCreate(); msg = wizMsg(); }
  else if (p === 'review') { html = renderReview(); msg = reviewMsg(); }
  else if (p === 'apps') { html = renderApps(); msg = 'Here is every app in the portal. Open one to request APIs or raise a support case.'; }
  else if (p === 'cases') { html = renderCases(); msg = S.cases.length ? 'This is the support team view. Close a case once the developer confirms the fix.' : 'No cases yet. Open an app and use Raise an issue to try it.'; }
  else if (p.startsWith('app-')) { html = renderApp(p.slice(4)); msg = appMsg(p.slice(4)); }
  else { html = renderHome(); msg = homeMsg(); }
  const samePage = p === lastPage;
  view.classList.toggle('no-anim', samePage);
  view.innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(n => n.toggleAttribute('aria-current', false));
  const navKey = p.startsWith('app-') ? 'apps' : p;
  const active = document.querySelector(`[data-nav="${navKey}"]`);
  if (active) active.setAttribute('aria-current', 'page');
  if (!samePage) { window.scrollTo(0, 0); lastPage = p; }
  say(msg, !samePage && msg !== currentMsg);
  bindTilt();
  if (!samePage && p === 'home') countUp();
}
function bindTilt() {
  view.querySelectorAll('.tilt').forEach(card => {
    card.addEventListener('pointermove', e => {
      if (reduce) return;
      const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      card.style.setProperty('--ry', (x * 12).toFixed(2) + 'deg'); card.style.setProperty('--rx', (-y * 12).toFixed(2) + 'deg');
      card.style.setProperty('--glare-x', ((x + .5) * 100).toFixed(0) + '%'); card.style.setProperty('--glare-y', ((y + .5) * 100).toFixed(0) + '%');
    });
    card.addEventListener('pointerleave', () => { card.style.setProperty('--ry', '0deg'); card.style.setProperty('--rx', '0deg'); });
  });
}
function countUp() {
  if (reduce) return;
  view.querySelectorAll('.stat__value').forEach(el => {
    const target = +el.dataset.target, start = performance.now();
    const step = now => { const p = Math.min((now - start) / 1100, 1); el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    el.textContent = '0'; requestAnimationFrame(step);
  });
}
function focusFirstError() {
  const el = view.querySelector('[aria-invalid=true], .alert');
  if (el) { el.scrollIntoView({block:'center', behavior:reduce ? 'auto' : 'smooth'}); if (el.focus) el.focus({preventScroll:true}); }
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { location.hash = go.dataset.go; return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act !== 'cancelreq') confirmCancel = null;
  if (act !== 'reset' && confirmReset) { confirmReset = false; document.getElementById('resetBtn').textContent = 'Reset demo'; }
  switch (act) {
    case 'replay': say(currentMsg, true); return;
    case 'set': { const o = forms()[b.dataset.obj]; o[b.dataset.k] = b.dataset.v; o.errors = {}; o.error = ''; if (b.dataset.k === 'env' || b.dataset.k === 'devId') wiz.existingId = ''; break; }
    case 'next':
      if (!validateStep()) { render(); focusFirstError(); return; }
      if (wiz.step === 3 || (wiz.step === 2 && wiz.mode === 'EXISTING')) submitWizard(); else wiz.step++;
      break;
    case 'back': wiz.step--; wiz.errors = {}; wiz.error = ''; break;
    case 'addkey': wiz.keys.push({kid:'', type:'Signing', expiry:'', comments:''}); delete wiz.errors.keys; break;
    case 'rmkey': wiz.keys.splice(+b.dataset.i, 1); wiz.errors = {}; break;
    case 'restart': wiz = freshWiz(); break;
    case 'copy':
      if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.text).then(() => toast('Copied.', ''), () => toast("Couldn't copy.", 'Select the text and copy it manually.'));
      else toast("Couldn't copy.", 'Select the text and copy it manually.');
      return;
    case 'reqopen': req = {appId:id, selected:[], reason:'', errors:{}, error:''}; cas.appId = cas.appId === id ? null : cas.appId; break;
    case 'reqclose': req.appId = null; break;
    case 'reqsubmit': {
      req.errors = {};
      if (!req.selected.length) req.errors.selected = 'Select at least one API.';
      if (!req.reason.trim()) req.errors.reason = 'Tell the API owner why you need access.';
      if (Object.keys(req.errors).length) { render(); focusFirstError(); return; }
      const a = appById(req.appId), names = [];
      req.selected.forEach(pid => { const n = ++S.seq.req; S.requests.push({id:'R' + n, num:'REQ-' + String(n).padStart(5, '0'), appId:a.id, apiId:pid, status:'Pending', reason:req.reason.trim(), devId:a.devId, created:Date.now()}); names.push(api(pid).name); });
      log(a.id, 'Access_Requested', 'Requested access to: ' + names.join(', ') + '.');
      save(); toast('Request sent.', `${names.length} API access request${names.length > 1 ? 's' : ''} sent to the API owner.`);
      req.appId = null; break;
    }
    case 'cancelreq': {
      if (confirmCancel !== id) { confirmCancel = id; break; }
      const r = S.requests.find(x => x.id === id);
      if (r && r.status === 'Pending') { r.status = 'Cancelled'; log(r.appId, 'Access_Cancelled', `${r.num} for ${api(r.apiId).name} was cancelled by the developer.`); save(); toast('Request cancelled.', r.num); }
      confirmCancel = null; break;
    }
    case 'caseopen': cas = {appId:id, step:'details', subject:'', category:'', desc:'', files:[], errors:{}, caseId:null}; req.appId = req.appId === id ? null : req.appId; break;
    case 'caseclose': cas.step = 'closed'; break;
    case 'casesubmit': {
      cas.errors = {};
      if (!cas.subject.trim()) cas.errors.subject = 'Enter a subject.';
      if (!cas.category) cas.errors.category = 'Choose a category.';
      if (!cas.desc.trim()) cas.errors.desc = 'Describe the issue.';
      if (Object.keys(cas.errors).length) { render(); focusFirstError(); return; }
      const n = ++S.seq.cas, c = {id:'C' + n, num:String(n).padStart(8, '0'), appId:cas.appId, subject:cas.subject.trim(), category:cas.category, desc:cas.desc.trim(), status:'New', files:[], created:Date.now()};
      S.cases.push(c); log(c.appId, 'Case_Raised', `Case ${c.num} raised: ${c.subject}`); save();
      cas.caseId = c.id; cas.step = 'files'; toast(`Case ${c.num} created.`, 'Our support team has been notified.'); break;
    }
    case 'casedone': cas.step = 'closed'; break;
    case 'closecase': { const c = S.cases.find(x => x.id === id); if (c) { c.status = 'Closed'; log(c.appId, 'Case_Closed', `Case ${c.num} closed by support.`); save(); toast('Case closed.', c.num); } break; }
    case 'review': rev = {reqId:id, decision:b.dataset.d, comments:'', errors:{}}; window.scrollTo({top:0, behavior:reduce ? 'auto' : 'smooth'}); break;
    case 'revcancel': rev.reqId = null; break;
    case 'revconfirm': {
      rev.errors = {};
      if (rev.decision === 'Rejected' && !rev.comments.trim()) { rev.errors.comments = 'Add a comment so the developer knows why.'; render(); focusFirstError(); return; }
      const r = S.requests.find(x => x.id === rev.reqId);
      if (r && r.status === 'Pending') {
        r.status = rev.decision; r.reviewComments = rev.comments.trim(); r.reviewedOn = Date.now(); r.reviewedBy = ME;
        log(r.appId, rev.decision === 'Approved' ? 'Access_Approved' : 'Access_Rejected', `${r.num} for ${api(r.apiId).name} ${rev.decision.toLowerCase()} by ${ME}${r.reviewComments ? ': ' + r.reviewComments : '.'}`);
        save(); toast(rev.decision === 'Approved' ? 'Request approved.' : 'Request rejected.', `${r.num}: ${api(r.apiId).name}. In Salesforce the developer gets an email.`);
      }
      rev.reqId = null; break;
    }
    case 'reset':
      if (!confirmReset) { confirmReset = true; b.textContent = 'Click again to reset'; return; }
      confirmReset = false; b.textContent = 'Reset demo';
      try { localStorage.removeItem(KEY); } catch (err2) { /* ignore */ }
      S = seed(); wiz = freshWiz(); req.appId = null; cas.appId = null; rev.reqId = null; lastPage = '';
      toast('Demo reset.', 'Sample data restored.');
      if (location.hash && location.hash !== '#home') { location.hash = 'home'; return; }
      break;
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) {
    const [obj, k] = el.dataset.bind.split('.');
    const o = forms()[obj]; o[k] = el.value;
    if (o.errors && o.errors[k]) { delete o.errors[k]; el.removeAttribute('aria-invalid'); const m = document.getElementById('err-' + k); if (m) m.remove(); }
    if (el.dataset.count) { const c = document.getElementById(el.dataset.count); if (c) c.textContent = `${el.value.length}/${el.maxLength}`; }
    if (obj === 'wiz' && (k === 'devId' || k === 'existingId')) { if (k === 'devId') wiz.existingId = ''; }
  } else if (el.dataset.key !== undefined) {
    wiz.keys[+el.dataset.key][el.dataset.kf] = el.value;
    el.removeAttribute('aria-invalid'); const m = el.parentElement.querySelector('.err'); if (m) m.remove();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.grant) {
    const v = el.dataset.grant;
    wiz.grants = el.checked ? [...new Set([...wiz.grants, v])] : wiz.grants.filter(g => g !== v);
    if (wiz.grants.length && wiz.errors.grants) { delete wiz.errors.grants; const m = document.getElementById('err-grants'); if (m) m.remove(); }
  } else if (el.dataset.pick) {
    const v = el.dataset.pick;
    req.selected = el.checked ? [...new Set([...req.selected, v])] : req.selected.filter(x => x !== v);
    el.closest('.pick').classList.toggle('sel', el.checked);
    if (req.selected.length && req.errors.selected) { delete req.errors.selected; const m = document.getElementById('err-selected'); if (m) m.remove(); }
  } else if (el.dataset.files) {
    const c = S.cases.find(x => x.id === cas.caseId);
    if (!c) return;
    const names = Array.from(el.files || []).map(f => f.name);
    c.files.push(...names); save();
    document.getElementById('filelist').textContent = `${c.files.length} file(s) attached: ${c.files.join(', ')}`;
    if (names.length) toast('Files attached.', `${names.length} file${names.length > 1 ? 's' : ''} added to case ${c.num}.`);
    el.value = '';
  }
});
window.addEventListener('hashchange', () => { confirmCancel = null; render(); });
render();
}
</script>
</body>
</html>
